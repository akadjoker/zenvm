name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Headless CI: build the zen CLI + portable modules only. Graphics/audio
# modules (glfw, sdl2, raylib, opengl, miniaudio) need system libs and a
# display, so they stay off here and are exercised locally instead.
env:
  ZEN_CI_CMAKE_FLAGS: >-
    -DZEN_ENABLE_GLFW=OFF
    -DZEN_ENABLE_SDL2=OFF
    -DZEN_ENABLE_RAYLIB_MODULE=OFF
    -DZEN_ENABLE_GL_MODULE=OFF
    -DZEN_ENABLE_AUDIO=OFF
    -DZEN_BUILD_VISUAL=OFF
    -DZEN_BUILD_GFX=OFF

jobs:
  linux:
    name: Linux (gcc, Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release $ZEN_CI_CMAKE_FLAGS

      - name: Build
        run: cmake --build build --target zen -j"$(nproc)"

      - name: Snapshot tests
        run: ZEN_TEST_VERBOSE=1 tests/run_zen_tests.sh bin/zen

  linux-sanitize:
    name: Linux (gcc, ASan+UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Debug build type enables -fsanitize=address,undefined (see CMakeLists)
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug $ZEN_CI_CMAKE_FLAGS

      - name: Build
        run: cmake --build build --target zen -j"$(nproc)"

      - name: Snapshot tests (sanitized)
        run: |
          export ASAN_OPTIONS=detect_leaks=0
          ZEN_TEST_VERBOSE=1 tests/run_zen_tests.sh bin/zen

  windows:
    name: Windows (MinGW, Release)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          $ZEN_CI_CMAKE_FLAGS

      - name: Build
        run: cmake --build build --target zen -j"$(nproc)"

      # Failures are re-emitted as ::error:: annotations so they are visible
      # through the public API (job logs need authentication).
      - name: Snapshot tests
        run: |
          set +e
          ZEN_TEST_VERBOSE=1 tests/run_zen_tests.sh bin/zen.exe | tee test_out.txt
          rc=${PIPESTATUS[0]}
          fails=$(grep '\[FAIL\]' test_out.txt | paste -sd'|' -)
          [ -n "$fails" ] && echo "::error::snapshot failures: $fails"
          # one annotation per failing test with the first diff lines
          awk '
            /\[FAIL\]/ { if (msg != "") print msg; name=$2; msg="::error::" name; n=0; next }
            /^        / { if (name != "" && n < 6) { line=$0; gsub(/%/,"%25",line); msg=msg "%0A" substr(line,1,160); n++ } next }
            { if (msg != "") print msg; msg=""; name="" }
            END { if (msg != "") print msg }
          ' test_out.txt | head -8
          summary=$(tail -n 12 test_out.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice::summary:%0A$summary"
          exit $rc
