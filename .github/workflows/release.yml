name: release

# Builds the same headless binaries as ci.yml, packages each with a platform
# suffix, and attaches them all to a GitHub Release when a vX.Y.Z tag is
# pushed. workflow_dispatch lets you dry-run the whole pipeline without
# cutting a real release — the publish step itself only fires on an actual
# tag push.
#
# Headless only for now, same as ci.yml: no raylib/SDL2/GLFW/audio. Those
# need system libs and a display that aren't set up in this workflow yet.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  ZEN_CI_CMAKE_FLAGS: >-
    -DZEN_ENABLE_GLFW=OFF
    -DZEN_ENABLE_SDL2=OFF
    -DZEN_ENABLE_RAYLIB_MODULE=OFF
    -DZEN_ENABLE_GL_MODULE=OFF
    -DZEN_ENABLE_AUDIO=OFF
    -DZEN_BUILD_VISUAL=OFF
    -DZEN_BUILD_GFX=OFF

jobs:
  linux:
    name: linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release $ZEN_CI_CMAKE_FLAGS
      - name: Build
        run: cmake --build build --target zen -j"$(nproc)"
      - name: Snapshot tests
        run: ZEN_TEST_VERBOSE=1 tests/run_zen_tests.sh bin/zen
      - name: Package
        run: |
          mkdir -p dist
          cp bin/zen dist/zen-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: zen-linux-x86_64
          path: dist/zen-linux-x86_64

  windows-mingw:
    name: windows-mingw-x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          $ZEN_CI_CMAKE_FLAGS

      - name: Build
        run: cmake --build build --target zen -j"$(nproc)"

      - name: Snapshot tests
        run: |
          set +e
          ZEN_TEST_VERBOSE=1 tests/run_zen_tests.sh bin/zen.exe | tee test_out.txt
          rc=${PIPESTATUS[0]}
          fails=$(grep '\[FAIL\]' test_out.txt | paste -sd'|' -)
          [ -n "$fails" ] && echo "::error::snapshot failures: $fails"
          exit $rc

      - name: Package
        run: |
          mkdir -p dist
          cp bin/zen.exe dist/zen-windows-mingw-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: zen-windows-mingw-x64
          path: dist/zen-windows-mingw-x64.exe

  publish:
    name: publish release
    needs: [linux, windows-mingw]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List staged assets
        run: ls -la dist
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
